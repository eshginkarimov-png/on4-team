<style>
:root{color-scheme:dark;--bg:#2a1105;--card:#3b190a;--line:#5a2f18;--cream:#f3ede2;--mute:#c9b8a6;--acc:#d9a16a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--cream);font:16px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
main{flex:1;overflow-y:auto;padding:20px 18px 24px;max-width:720px;width:100%;margin:0 auto}
.scr{display:none}.scr.on{display:block}h1{font-size:28px;margin:0 0 4px}h3{margin:0}.sub{color:var(--mute);margin:0 0 20px;font-size:15px}
.home{text-align:center;padding-top:8vh}.home img{width:min(78%,360px);display:block;margin:0 auto 28px}.home p{color:var(--mute);max-width:420px;margin:0 auto 26px}
.btn{display:block;background:var(--cream);color:#2a1105;padding:14px;border-radius:14px;text-decoration:none;text-align:center;border:0;font:inherit;font-weight:600;width:100%;cursor:pointer;margin-bottom:10px}.btn.o{background:none;color:var(--cream);border:1px solid var(--line)}.btn.s{padding:9px;font-size:14px}
.pkg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}.pkg.top{border-color:var(--acc)}.pkg small{color:var(--acc);font-weight:600;letter-spacing:.08em;font-size:12px}
.pkg h3{font-size:22px;margin:2px 0}.pr{font-size:26px;font-weight:600;margin:6px 0}.pr span{font-size:14px;color:var(--mute);font-weight:400}
.d{color:var(--mute);font-size:14px}.pkg h4{margin:14px 0 6px;font-size:12px;letter-spacing:.08em;color:var(--acc)}.pkg ul{margin:0;padding-left:18px;font-size:14px}.pkg li{margin-bottom:3px}.note{font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}.tab{flex:none;background:none;border:1px solid var(--line);color:var(--mute);padding:8px 14px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}.tab.on{background:var(--cream);color:#2a1105;border-color:var(--cream)}
.proj{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;overflow:hidden}.proj img{width:calc(100% + 32px);margin:-16px -16px 12px;display:block;max-height:200px;object-fit:cover}.proj small{color:var(--acc);font-weight:600;font-size:12px;letter-spacing:.06em}.proj h3{font-size:18px;margin:4px 0}.proj p{margin:0;color:var(--mute);font-size:14px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--mute);margin:8px 6px 0 0}
.row{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;color:var(--cream);text-decoration:none;margin-bottom:10px}.row span:last-child{color:var(--mute)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:9}.sheet.on{display:flex}.sheet>div{background:var(--card);width:100%;max-width:720px;margin:0 auto;border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto}
.bar{display:flex;border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}.bar button{flex:1;background:none;border:0;color:var(--mute);padding:12px 4px;font:inherit;font-size:12px;cursor:pointer}.bar button.on{color:var(--cream);font-weight:600;box-shadow:inset 0 2px 0 var(--acc)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}summary{font-weight:600;cursor:pointer}
.ed{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}label{display:block;font-size:12px;color:var(--mute);margin:8px 0}
input,select,textarea{width:100%;background:var(--bg);color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px;margin-top:4px}input[type=checkbox]{width:auto;margin-right:8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--cream);color:#2a1105;padding:10px 18px;border-radius:99px;font-weight:600;display:none;z-index:20}
.th{width:100%;max-height:160px;object-fit:cover;border-radius:10px;margin-top:6px;display:block}.ft{text-align:center;color:var(--mute);font-size:12px;margin-top:36px;padding:10px}body{background:radial-gradient(120% 55% at 50% -8%,#4d220e 0,var(--bg) 62%) fixed;padding-bottom:env(safe-area-inset-bottom,0px)}
main{overflow-x:hidden}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,30px) scale(1.25)}}
@keyframes shine{0%,55%{left:-60%}100%{left:140%}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.55)}100%{transform:scale(1)}}
.scr.on{animation:fade .4s cubic-bezier(.2,.8,.2,1)}
.scr.on .pkg,.scr.on .proj,.scr.on .row,.scr.on .fav{animation:up .6s cubic-bezier(.2,.8,.2,1) both}
.pkg:nth-child(2),.proj:nth-child(2),.row:nth-child(2),.fav:nth-child(2){animation-delay:.08s!important}
.pkg:nth-child(3),.proj:nth-child(3),.row:nth-child(3),.fav:nth-child(3){animation-delay:.16s!important}
.pkg:nth-child(4),.proj:nth-child(4),.row:nth-child(4),.fav:nth-child(4){animation-delay:.24s!important}
.pkg:nth-child(n+5),.proj:nth-child(n+5),.row:nth-child(n+5),.fav:nth-child(n+5){animation-delay:.32s!important}
h1{letter-spacing:-.02em;font-size:30px}
.home{position:relative;min-height:68vh}.home .lg{animation:float 5s ease-in-out infinite;position:relative}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.38;animation:drift 12s ease-in-out infinite alternate;pointer-events:none}
.o1{width:230px;height:230px;background:#c0683a;top:0;left:-70px}.o2{width:210px;height:210px;background:#8a3b14;bottom:0;right:-60px;animation-delay:-6s}
.home p,.home .btn,.home .chips{position:relative}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.chips.c{justify-content:center;margin:0 0 22px}
.chips span{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:4px 11px;color:var(--mute);background:rgba(59,25,10,.5)}
.btn{position:relative;overflow:hidden;transition:transform .15s}.btn:active{transform:scale(.97)}
.btn:not(.o)::after{content:"";position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 3.5s infinite}
.pkg,.proj,.fav{background:linear-gradient(160deg,#4a2110,#331508);border:1px solid #5f321b;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .2s,box-shadow .2s}
.pkg,.proj{position:relative}.pkg:active,.proj:active{transform:scale(.985)}
.pkg.top{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 14px 40px rgba(217,161,106,.16)}
.pkg h3{padding-right:46px;font-size:24px}.pr{font-size:30px}.pr b{font-weight:700;letter-spacing:-.02em}
.bg{font-style:normal;font-size:11px;letter-spacing:.06em;background:rgba(36,14,4,.72);color:var(--acc);padding:4px 10px;border-radius:99px;display:inline-block;font-weight:600}
.pkg .bg{position:absolute;top:-10px;left:18px;background:var(--acc);color:#2a1105}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.8,.2,1)}.more>div{overflow:hidden}.pkg.open .more{grid-template-rows:1fr}
.tg{background:none;border:0;color:var(--acc);font:inherit;font-size:14px;font-weight:600;padding:12px 0 0;cursor:pointer;display:flex;align-items:center;gap:6px}.tg svg{width:16px;height:16px;transition:transform .3s}.pkg.open .tg svg{transform:rotate(180deg)}
.hb{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(36,14,4,.55);backdrop-filter:blur(6px);color:var(--cream);display:grid;place-items:center;cursor:pointer;z-index:2}
.hb svg,.ic{width:21px;height:21px;transition:transform .25s,fill .25s}.hb.on svg{fill:#e8745a;stroke:#e8745a}.hb.pop svg{animation:pop .45s}
.proj{padding:0}.pv{height:150px;position:relative;background:linear-gradient(135deg,#74331a,#2f1306);display:grid;place-items:center;overflow:hidden}.pv span{font-size:68px;opacity:.4;font-weight:300}
.proj .pv img{position:absolute;inset:0;width:100%;height:100%;max-height:none;margin:0;object-fit:cover}.pv .bg{position:absolute;left:12px;bottom:12px}.pb{padding:14px 16px 16px}.pb h3{font-size:19px}
.tab{transition:all .25s}.tab.on{transform:scale(1.04)}
.fav{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:14px;padding:14px 16px;margin-bottom:10px}.fav small{color:var(--acc);font-weight:600;font-size:11px;letter-spacing:.08em}.fav h3{font-size:18px}.fav .hb{position:static;flex:none}
.empty{text-align:center;padding:50px 10px;color:var(--mute)}.empty svg{width:56px;height:56px;color:var(--acc);margin-bottom:12px;animation:float 3s ease-in-out infinite}
.sheet{display:flex;opacity:0;pointer-events:none;transition:opacity .3s}.sheet.on{opacity:1;pointer-events:auto}
.sheet>div{transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}.sheet.on>div{transform:none}
.bar{margin:0 12px 8px;border:1px solid var(--line);border-radius:24px;background:rgba(59,25,10,.88);backdrop-filter:blur(16px);padding:0;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.bar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:10px 2px}.bar button.on{box-shadow:none;color:var(--cream)}
.bar button.on .ic{color:var(--acc);transform:translateY(-2px) scale(1.12)}
.bd{position:absolute;top:5px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:9px;background:#e8745a;color:#fff;font:600 10px/16px -apple-system,system-ui,sans-serif;text-align:center;display:none;font-style:normal;padding:0 4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

loadImgs();$('tb').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;rPj()});

const f=(l,p,v)=>`<label>${l}<input value="${esc(v)}" oninput="set('${p}',this.value)"></label>`;
const tx=(l,p,v)=>`<label>${l}<textarea rows="3" oninput="set('${p}',this.value)">${esc(v)}</textarea></label>`;
const ls=(l,p,a)=>`<label>${l} (hər sətir ayrı)<textarea rows="5" oninput="set('${p}',this.value.split('\\n').filter(Boolean))">${esc(a.join('\n'))}</textarea></label>`;
function adm(){return `<h3>İdarəetmə paneli</h3><p class="d">${esc(user.email)}${live?'':' — demo rejim: dəyişikliklər yalnız bu cihazda saxlanır'}</p>

function add(k){S[k].push(k=='packages'?{n:'YENİ PAKET',d:'',p:0,i:[],c:[]}:{k:CATS[1]||'',n:'Yeni layihə',d:'',t:[],x:'',img:''});rPf()}
function del(k,i){if(confirm('Silinsin?')){S[k].splice(i,1);rPf()}}
async function save(){try{if(live)await fs.setDoc(fs.doc(db,'app','content'),S);else localStorage.setItem('on4',JSON.stringify(S));render();toast('Yadda saxlanıldı')}catch(e){toast('Xəta: saxlanmadı')}}
async function login(){const e=$('le').value.trim(),p=$('lp').value;try{if(live)await au.signInWithEmailAndPassword(auth,e,p);else if(p==='admin'){user={email:e||'admin'};rPf()}else toast('Parol səhvdir')}catch(x){toast('Giriş alınmadı')}}
async function out(){if(live)await au.signOut(auth);user=null;showLogin=false;taps=0;rPf()}
let showLogin=false,taps=0;function tap(){if(++taps>=7){showLogin=true;rPf()}}
const IM={};
async function getImg(id){if(IM[id])return IM[id];try{let d;if(live){const s=await fs.getDoc(fs.doc(db,'images',id));d=s.exists()?s.data().d:null}else d=localStorage.getItem('on4img:'+id);if(d)IM[id]=d;return d}catch(e){return null}}
function loadImgs(){document.querySelectorAll('img[data-im]').forEach(async el=>{const id=el.dataset.im;if(/^(https?:|data:)/.test(id)){el.src=id;return}const d=await getImg(id);if(d)el.src=d})}
function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.75))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
async function pick(i,inp){const file=inp.files[0];if(!file)return;try{toast('Foto yüklənir...');const d=await shrink(file),id='i'+Date.now().toString(36);if(live)await fs.setDoc(fs.doc(db,'images',id),{d});else localStorage.setItem('on4img:'+id,d);IM[id]=d;S.portfolio[i].img=id;rPf();toast('Foto əlavə olundu. "Yadda saxla" basın')}catch(e){toast('Foto yüklənmədi')}}
function rmImg(i){S.portfolio[i].img='';rPf()}
const rPf0=rPf;rPf=function(){const o=[...document.querySelectorAll('#pf details')].map(d=>d.open);rPf0();document.querySelectorAll('#pf details').forEach((d,i)=>d.open=o[i]??d.open);loadImgs()};
function renCat(i,v){v=v.trim();if(!v||S.cats.includes(v)){toast('Ad boş və ya təkrardır');rPf();return}const o=S.cats[i];S.cats[i]=v;S.portfolio.forEach(x=>{if(x.k==o)x.k=v});syncC();rPj();rPf()}
function delCat(i){if(S.portfolio.some(x=>x.k==S.cats[i])){toast('Bu kateqoriyada layihə var, əvvəl onları köçürün');return}if(confirm('Silinsin?')){S.cats.splice(i,1);syncC();cur=0;rPj();rPf()}}
function addCat(){let n='Yeni kateqoriya',k=2;while(S.cats.includes(n))n='Yeni kateqoriya '+k++;S.cats.push(n);syncC();rPj();rPf()}

const IC={h:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',p:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 14h8"/>',j:'<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/>',f:'<path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/>',u:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',c:'<path d="M6 9l6 6 6-6"/>'};
const svg=k=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
let curT=0,FAV=[];try{FAV=JSON.parse(localStorage.getItem('on4fav')||'[]')}catch(e){}
const isF=k=>FAV.includes(k);
const hb=k=>`<button class="hb ${isF(k)?'on':''}" data-k="${esc(k)}" aria-label="Sevimlilər" onclick="event.stopPropagation();tgl(this.dataset.k)">${svg('f')}</button>`;
function nf(){const b=$('bd');if(b){b.textContent=FAV.length;b.style.display=FAV.length?'block':'none'}}
function tgl(k){const i=FAV.indexOf(k);i<0?FAV.push(k):FAV.splice(i,1);try{localStorage.setItem('on4fav',JSON.stringify(FAV))}catch(e){}
navigator.vibrate&&navigator.vibrate(12);document.querySelectorAll('.hb').forEach(b=>{if(b.dataset.k===k){b.classList.toggle('on',isF(k));b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}});nf();if(curT==4)setTimeout(rFav,280)}
function go(t){curT=t;document.querySelectorAll('.scr').forEach((e,j)=>e.classList.toggle('on',j==t));document.querySelectorAll('#bar button').forEach(b=>b.classList.toggle('on',+b.dataset.t==t));document.querySelector('main').scrollTop=0;if(t==1)cnt();if(t==4)rFav()}
