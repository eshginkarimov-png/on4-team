name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Faylları qovluqlara yerləşdir
        run: |
          mkdir -p www assets
          for f in index.html manifest.webmanifest sw.js icon-192.png icon-512.png; do
            if [ -f "$f" ]; then mv "$f" www/; fi
          done
          for f in icon-only.png splash.png; do
            if [ -f "$f" ]; then mv "$f" assets/; fi
          done
          ls www assets
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - run: npm install -D @capacitor/assets
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: on4-team-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
